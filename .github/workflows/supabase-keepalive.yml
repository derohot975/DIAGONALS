name: Supabase Keepalive

# Tiene attivo il progetto Supabase (piano Free) evitando la pausa per inattivita'.
# Supabase Free sospende il progetto dopo ~7 giorni senza attivita': un ping ogni 2 giorni basta.
# Questo scheduler e' ESTERNO all'app: funziona anche quando il servizio Render dorme.
#
# Catena: GitHub Actions (cron) -> health endpoint dell'app su Render -> query reale al DB
# (ruolo postgres, bypassa RLS) -> istanza Supabase resta attiva.
# NB: dopo l'attivazione della RLS (migrazione 0001) l'anon NON puo' piu' leggere via PostgREST,
# quindi il ping va fatto sull'app (che accede al DB col ruolo proprietario), non su /rest/v1.
# Per disattivare: elimina questo file oppure disabilita il workflow dalla tab Actions del repo.

on:
  schedule:
    # Ogni 2 giorni alle 06:17 UTC (orario non tondo per non concentrarsi sui picchi GitHub).
    - cron: '17 6 */2 * *'
  # Permette il ping manuale dalla tab Actions per test/verifica.
  workflow_dispatch:

# Evita run concorrenti se uno schedule si sovrappone a un trigger manuale.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health dell'app (interroga il DB col ruolo proprietario)
        run: |
          set -euo pipefail
          # L'health endpoint dell'app esegue una query reale sul DB (warm-up) col ruolo
          # postgres che bypassa la RLS: tiene attiva sia l'app Render sia il DB Supabase.
          # Nessun segreto necessario: e' un endpoint pubblico read-only.
          URL="https://diagonals.onrender.com/api/health"
          BODY=$(curl -s --max-time 60 --retry 3 --retry-delay 10 "${URL}")
          echo "Risposta: ${BODY}"
          # L'health risponde sempre 200; verifico che il DB risulti raggiungibile nel body.
          if echo "${BODY}" | grep -q '"status":"ok"'; then
            echo "Keepalive OK: app e DB Supabase attivi."
          else
            echo "::error::Keepalive: health non ok. ${BODY}"
            exit 1
          fi
